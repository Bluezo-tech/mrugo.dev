<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" fill="none" role="presentation">
  <!-- Ugochukwu portfolio: own wave-line texture, drawn for this site.
       Symmetric curves so the tile repeats without a visible seam. -->
