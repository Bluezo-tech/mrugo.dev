    <path d="M0 90 C225 40 675 140 900 90" stroke-opacity="0.22" stroke-width="1.6"/>
    <path d="M0 56 C225 6 675 106 900 56" stroke-opacity="0.11" stroke-width="1.2"/>
    <path d="M0 124 C225 74 675 174 900 124" stroke-opacity="0.11" stroke-width="1.2"/>
  </g>
  <g stroke="#cacbd0" stroke-linecap="round" fill="none">
    <path d="M0 160 C225 110 675 210 900 160" stroke-opacity="0.10" stroke-width="1.1"/>
  </g>
</svg>
